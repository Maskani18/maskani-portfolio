# MASKANI — CI pipeline (§11 Build Reference).
#
# Urutan: Lint + Type Check → Build (satu artefak) → Playwright + axe
# (paralel dengan Lighthouse CI) → PASS → deploy artefak yang sama.
#
# Aturan yang ditegakkan:
#   CI-01  build sekali, uji artefak itu, deploy artefak itu
#   CI-02  produksi hanya dari CI setelah PASS (auto-deploy Git dimatikan
#          di dashboard Vercel — tindakan manual, diverifikasi di 8d)
#   CI-03  satu retry Playwright
#   CI-07  gerbang merah memblokir merge

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_ENV: production

jobs:
  verify:
    name: Lint · Type Check · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + content guard)
        run: npm run lint

      - name: Guard self-test (P0-02, G-0 #2)
        run: npm run test:guard

      - name: Type check
        run: npm run typecheck

      - name: Build (single artifact)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: Playwright + axe
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Run Lighthouse CI
        run: npx lhci autorun

# Catatan: job deploy ditambahkan di langkah 8d setelah Vercel + GitHub
# terhubung, dan setelah auto-deploy produksi dimatikan di dashboard Vercel.